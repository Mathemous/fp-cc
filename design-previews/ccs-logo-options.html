<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCS Round-C Logo Options</title>
    <style>
      :root {
        --navy: #10375f;
        --ink: rgba(210, 229, 247, 0.42);
        --ink-strong: rgba(226, 240, 252, 0.55);
        --ink-soft: rgba(210, 229, 247, 0.25);
        --red: rgba(229, 54, 77, 0.58);
        --red-soft: rgba(229, 54, 77, 0.38);
        --white: rgba(255,255,255,.58);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse at 55% 0%, #2a669d 0%, #10375f 44%, #081f3d 100%);
        color: white;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        padding: 28px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 650;
        color: rgba(255,255,255,.86);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .card {
        min-height: 270px;
        border: 1px solid rgba(255,255,255,.12);
        background:
          linear-gradient(120deg, rgba(255,255,255,.035), transparent 58%),
          rgba(2, 26, 51, .22);
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 24px;
      }
      .card h2 {
        justify-self: start;
        align-self: start;
        margin: 0 0 18px;
        color: rgba(255,255,255,.72);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
      }
      svg { width: min(100%, 500px); height: auto; overflow: visible; }
      .ink { fill: var(--ink); }
      .ink-strong { fill: var(--ink-strong); }
      .ink-soft { fill: var(--ink-soft); }
      .red { fill: var(--red); }
      .red-soft { fill: var(--red-soft); }
      .navy { fill: rgba(16,55,95,.76); }
      .white { fill: var(--white); }
      .line { fill: none; stroke: rgba(226,240,252,.36); stroke-width: 5; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>CCS concepts with a true circular center in the middle C</h1>

            <path class="ink" fill-rule="evenodd" d="M0-78a78 78 0 1 0 0 156 78 78 0 0 0 0-156Zm0 43a35 35 0 1 1 0 70 35 35 0 0 1 0-70Z"/>

        </svg>

        </svg>
      </section>
    </main>
  </body>
</html>
